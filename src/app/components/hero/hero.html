<section
  id="inicio"
  aria-labelledby="hero-title"
  class="mx-auto max-w-[1600px] px-5 pt-12 lg:px-4 lg:pt-14"
>
  <div class="grid items-center gap-12 lg:grid-cols-[45%_45%] lg:justify-evenly lg:gap-0">
    <div class="order-2 lg:order-2">
      <h1 id="hero-title" class="font-display text-[clamp(4rem,8vw,7.2rem)] leading-none text-ink">
        9000
      </h1>
      <app-brush-underline class="hero-underline" variant="red" />
      <p class="mt-5 text-[clamp(1.5rem,3.2vw,2.6rem)] text-ink">Victor Kovalski</p>
      <p class="mt-7 max-w-[46ch] text-lg leading-[1.7] text-ink">
        Victor é conhecido por diversos nomes, alguns incluem: Kovalski, Victor Tchoga, só "Tchoga"
        ...<br />
        Mas com certeza, seu vulgo mais famoso é o <strong>9000</strong>. Aqui mostraremos o
        surgimento do 9 mil.
      </p>
      <a
        class="hero-cta mt-8 inline-flex min-h-12 items-center gap-4 bg-accent px-6 py-3 text-base text-base no-underline transition-colors hover:bg-amber-500"
        href="#quem-e-o-9"
        >Quem é o 9 <span aria-hidden="true">-&gt;</span></a
      >
    </div>
    <figure class="order-1 m-0 lg:order-1">
      <div class="hero-photo relative mx-auto aspect-[4/3] w-full max-w-[760px]">
        <img
          class="hero-photo-image"
          src="imgs/imagemParaHeroSection9.png"
          alt="Victor Kovalski de moletom segurando um celular diante de um fundo escuro, com o número 9 pintado ao fundo."
          width="753"
          height="564"
          fetchpriority="high"
        />
      </div>
    </figure>
  </div>
  <div
    role="separator"
    aria-label="Fim da seção de abertura"
    class="mt-16 border-t-2 border-dashed border-line/70 pb-10"
  ></div>
</section>
